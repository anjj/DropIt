services:
  db:
    image: postgres:16-alpine
    container_name: dropit_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: dropit
      POSTGRES_PASSWORD: dropit_secret
      POSTGRES_DB: dropit
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
